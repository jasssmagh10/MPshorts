# v2 - forced refresh for CLI inputs
name: Render Video


on:
  workflow_dispatch:
    inputs:
      enable_overlay:
        description: 'Enable Overlay (True/False)'
        required: true
        default: 'False'
      overlay_type:
        description: 'Overlay Type (chromakey/transparent)'
        required: true
        default: 'chromakey'
      overlay_opacity:
        description: 'Overlay Opacity (0.0 to 1.0)'
        required: true
        default: '0.25'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('longform/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        working-directory: longform
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Whisper Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-whisper-small.en
          restore-keys: |
            ${{ runner.os }}-whisper-

      - name: Run video rendering script
        working-directory: longform
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # These read from the CLI inputs, with fallbacks if not provided
          ENABLE_OVERLAY: ${{ github.event.inputs.enable_overlay }}
          OVERLAY_TYPE: ${{ github.event.inputs.overlay_type }}
          OVERLAY_OPACITY: ${{ github.event.inputs.overlay_opacity }}
        run: python Vmaker.py

      - name: Upload video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: longform/final_video.mp4
          retention-days: 7
          if-no-files-found: warn