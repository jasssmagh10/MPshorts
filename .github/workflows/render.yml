# v3 - procedural overlay modes + multilingual whisper + tunable BGM
name: Render Video

on:
  workflow_dispatch:
    inputs:
      enable_overlay:
        description: 'Enable Overlay (True/False)'
        required: true
        default: 'True'
      overlay_type:
        description: 'Overlay Type: film_alive | scratches | flicker | chromakey | transparent | custom'
        required: true
        default: 'film_alive'
      overlay_opacity:
        description: 'Overlay Opacity (0.0 to 1.0)'
        required: true
        default: '0.35'
      bgm_volume:
        description: 'BGM Volume (e.g. 0.08)'
        required: false
        default: '0.08'
      whisper_model:
        description: 'Whisper model: base | small | medium'
        required: false
        default: 'small'
      custom_filter:
        description: 'Custom FFmpeg filter (only used if overlay_type=custom)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('longform/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        working-directory: longform
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache BOTH small and base Whisper models so either can be used without downloading
      - name: Cache Whisper Model (small)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-whisper-small
          restore-keys: |
            ${{ runner.os }}-whisper-

      - name: Run video rendering script
        working-directory: longform
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_OVERLAY: ${{ github.event.inputs.enable_overlay }}
          OVERLAY_TYPE: ${{ github.event.inputs.overlay_type }}
          OVERLAY_OPACITY: ${{ github.event.inputs.overlay_opacity }}
          BGM_VOLUME: ${{ github.event.inputs.bgm_volume }}
          WHISPER_MODEL_SIZE: ${{ github.event.inputs.whisper_model }}
          CUSTOM_FILTER: ${{ github.event.inputs.custom_filter }}
        run: python Vmaker.py

      - name: Upload video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: longform/final_video.mp4
          retention-days: 7
          if-no-files-found: warn