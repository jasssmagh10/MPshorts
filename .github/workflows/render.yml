name: Render Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # FIX 1: Added fonts-dejavu-core for the ASS subtitle font
      # FIX 2: Added cache for apt to speed up FFmpeg installation
      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      # OPTIMIZATION: Cache pip dependencies to save time
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('longform/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        working-directory: longform
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # OPTIMIZATION: Cache the Whisper model to avoid re-downloading it every run
      - name: Cache Whisper Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-whisper-${{ env.WHISPER_MODEL_SIZE }}
          restore-keys: |
            ${{ runner.os }}-whisper-

      - name: Run video rendering script
        working-directory: longform
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Vmaker.py

      - name: Upload video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: longform/final_video.mp4
          retention-days: 7
          if-no-files-found: warn