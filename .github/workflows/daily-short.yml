name: Daily Short

on:
  schedule:
    # Morning run: 09:07 IST = 03:37 UTC
    - cron: "37 3 * * *"
    # Evening run: 18:07 IST = 12:37 UTC
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

env:
  # Pin to a release tag instead of floating on `main`, so an upstream config
  # or CLI change can't silently break the scheduled run. Bump deliberately.
  MPT_REF: v1.3.6

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out automation repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install helper dependencies
        run: pip install -r requirements.txt

      - name: Select today's topic
        id: topic
        run: |
          TOPIC="$(python select_topic.py | tail -n 1)"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "Selected: $TOPIC"

      - name: Clone MoneyPrinterTurbo
        run: git clone --depth 1 --branch "$MPT_REF" https://github.com/harry0703/MoneyPrinterTurbo.git mpt

      - name: Prepare MoneyPrinterTurbo configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_NAME: ${{ vars.VOICE_NAME }}
          BGM_TYPE: ${{ vars.BGM_TYPE }}
          SUBTITLE_POSITION: ${{ vars.SUBTITLE_POSITION }}
          SUBTITLE_COLOR: ${{ vars.SUBTITLE_COLOR }}
          SUBTITLE_BG_COLOR: ${{ vars.SUBTITLE_BG_COLOR }}
        run: python prepare_mpt.py mpt

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: mpt
        run: uv sync --frozen

      - name: Generate one portrait Short
        working-directory: mpt
        run: |
          TOPIC="$(cat ../selected_topic.txt)"
          echo "Generating: $TOPIC"
          # video-aspect / video-count are passed explicitly: MPT's CLI does
          # not reliably inherit these from the [ui] block in config.toml.
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if uv run python cli.py --video-subject "$TOPIC" --video-aspect "9:16" --video-count 1; then
              exit 0
            fi
            echo "Attempt $attempt failed — Gemini's free tier occasionally returns a transient 503 under high demand. Retrying in 30s."
            sleep 30
          done
          echo "All 3 attempts failed"
          exit 1

      - name: Locate generated MP4
        id: video
        working-directory: mpt
        run: |
          VIDEO="$(find . -type f -iname '*.mp4' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$VIDEO" ]; then
            echo "No MP4 was generated"
            find . -maxdepth 4 -type f | sort | tail -100
            exit 1
          fi
          echo "path=mpt/$VIDEO" >> "$GITHUB_OUTPUT"
          echo "Generated: $VIDEO"

      - name: Send video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_TOPIC: ${{ steps.topic.outputs.topic }}
        run: python send_to_telegram.py "${{ steps.video.outputs.path }}"

      - name: Generate YouTube description
        id: description
        continue-on-error: true # best-effort: must never block video delivery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          SCRIPT_JSON="$(dirname "${{ steps.video.outputs.path }}")/script.json"
          echo "script_json=$SCRIPT_JSON" >> "$GITHUB_OUTPUT"
          python generate_youtube_description.py "$SCRIPT_JSON" description.txt

      - name: Send script/keywords/upload-command to Telegram
        if: steps.description.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_TOPIC: ${{ steps.topic.outputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          YT_DEFAULT_STATUS: ${{ vars.YT_DEFAULT_STATUS }}
        run: python send_to_telegram.py "${{ steps.video.outputs.path }}" "${{ steps.description.outputs.script_json }}" description.txt

      - name: Mark topic as used
        env:
          TOPIC: ${{ steps.topic.outputs.topic }}
        run: |
          python mark_topic_used.py "$TOPIC"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.txt
          if git diff --cached --quiet; then
            echo "No change to used_topics.txt"
          else
            git commit -m "chore: mark topic as used [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-diagnostics
          path: |
            selected_topic.txt
            mpt/storage/**/*.log
          if-no-files-found: ignore
          retention-days: 3