name: Daily Short

on:
  schedule:
    - cron: "37 3 * * *"
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

env:
  MPT_REF: v1.3.6

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out automation repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install helper dependencies
        run: pip install -r requirements.txt

      - name: Pre-flight provider check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: python preflight.py

      - name: Generate and fact-check script
        id: script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          python generate_script.py topics.txt used_topics.txt script.json selected_topic.txt
          echo "topic=$(cat selected_topic.txt)" >> "$GITHUB_OUTPUT"

      - name: Clone MoneyPrinterTurbo
        run: git clone --depth 1 --branch "$MPT_REF" https://github.com/harry0703/MoneyPrinterTurbo.git mpt

      - name: Prepare MoneyPrinterTurbo configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIDEO_SOURCE: pexels
          VOICE_NAME: ${{ vars.VOICE_NAME }}
          BGM_TYPE: ${{ vars.BGM_TYPE }}
          SUBTITLE_POSITION: ${{ vars.SUBTITLE_POSITION }}
          SUBTITLE_COLOR: ${{ vars.SUBTITLE_COLOR }}
          SUBTITLE_BG_COLOR: ${{ vars.SUBTITLE_BG_COLOR }}
        run: python prepare_mpt.py mpt

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: mpt
        run: uv sync --frozen

      - name: Generate one portrait Short
        working-directory: mpt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VOICE_NAME: ${{ vars.VOICE_NAME }}
          BGM_TYPE: ${{ vars.BGM_TYPE }}
          SUBTITLE_POSITION: ${{ vars.SUBTITLE_POSITION }}
          SUBTITLE_COLOR: ${{ vars.SUBTITLE_COLOR }}
          SUBTITLE_BG_COLOR: ${{ vars.SUBTITLE_BG_COLOR }}
        run: |
          TOPIC="$(cat ../selected_topic.txt)"
          SCRIPT="$(python3 -c "import json; print(json.load(open('../script.json'))['script'])")"
          TERMS="$(python3 -c "import json; print(json.load(open('../script.json'))['search_terms'])")"
          echo "Topic: $TOPIC"
          echo "Terms: $TERMS"

          SOURCES=("pexels" "pixabay")
          for source in "${SOURCES[@]}"; do
            echo "=== Trying video source: $source ==="
            cd ..
            VIDEO_SOURCE="$source" python prepare_mpt.py mpt
            cd mpt

            if uv run python cli.py \
              --video-subject "$TOPIC" \
              --video-script "$SCRIPT" \
              --video-terms "$TERMS" \
              --video-aspect "9:16" \
              --video-count 1; then
              echo "=== Success with source: $source ==="
              exit 0
            fi
            echo "=== Source $source failed, rotating ==="
          done

          echo "All video sources failed"
          exit 1

      - name: Locate generated MP4
        id: video
        working-directory: mpt
        run: |
          VIDEO="$(find . -type f -iname '*.mp4' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$VIDEO" ]; then
            echo "No MP4 was generated"
            find . -maxdepth 4 -type f | sort | tail -100
            exit 1
          fi
          echo "path=mpt/$VIDEO" >> "$GITHUB_OUTPUT"
          echo "Generated: $VIDEO"

      - name: Send video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_TOPIC: ${{ steps.script.outputs.topic }}
        run: python send_to_telegram.py "${{ steps.video.outputs.path }}"

      - name: Generate YouTube description
        id: description
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          SCRIPT_JSON="$(dirname "${{ steps.video.outputs.path }}")/script.json"
          echo "script_json=$SCRIPT_JSON" >> "$GITHUB_OUTPUT"
          python generate_youtube_description.py "$SCRIPT_JSON" description.txt

      - name: Send script/keywords/upload-command to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_TOPIC: ${{ steps.script.outputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          YT_DEFAULT_STATUS: ${{ vars.YT_DEFAULT_STATUS }}
        run: python send_to_telegram.py "${{ steps.video.outputs.path }}" "${{ steps.description.outputs.script_json }}" description.txt

      - name: Mark topic as used
        env:
          TOPIC: ${{ steps.script.outputs.topic }}
        run: |
          python mark_topic_used.py "$TOPIC"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.txt
          if git diff --cached --quiet; then
            echo "No change to used_topics.txt"
          else
            git commit -m "chore: mark topic as used [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-diagnostics
          path: |
            selected_topic.txt
            script.json
            description.txt
            mpt/storage/**/*.log
          if-no-files-found: ignore
          retention-days: 3